name: build

# Build release binaries for:
#   - ubuntu-22.04 amd64      (native x86_64)
#   - ubuntu-22.04 aarch64    (native ARM runner)
#   - android aarch64         (cross-compiled via NDK)
#
# Final output: a single artifact named MLK-<version> containing all binaries
# at the root and build logs under logs/.
# Intermediate build artifacts are deleted after collection.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build.yml'
    tags: ['v*']
  pull_request:
    paths: ['src/**', 'Cargo.toml', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: build / ${{ matrix.target.arch }}
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Prepare
        run: |
          mkdir -p logs out
          echo "=== Build started: ${{ matrix.target.arch }} ===" > logs/build-${{ matrix.target.arch }}.log
          echo "Date: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S CST')" >> logs/build-${{ matrix.target.arch }}.log
          echo "" >> logs/build-${{ matrix.target.arch }}.log

      - name: Compute version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-$(echo "${GITHUB_SHA}" | cut -c1-8)"
          fi
          echo "BUILD_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Version: ${VERSION}" >> logs/build-${{ matrix.target.arch }}.log
          echo "" >> logs/build-${{ matrix.target.arch }}.log

      - name: Build
        run: |
          set +e
          echo "=== cargo build --release ===" >> logs/build-${{ matrix.target.arch }}.log
          cargo build --release 2>&1 | tee -a logs/build-${{ matrix.target.arch }}.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "" >> logs/build-${{ matrix.target.arch }}.log
          echo "=== Build exit code: ${BUILD_EXIT} ===" >> logs/build-${{ matrix.target.arch }}.log
          echo "BUILD_EXIT=${BUILD_EXIT}" >> "$GITHUB_ENV"
          if [ "$BUILD_EXIT" = "0" ]; then
            cp target/release/mtk-logo-toolkit "out/MLK-${{ matrix.target.arch }}-${BUILD_VERSION}"
          fi
          exit 0

      - name: Smoke test
        if: env.BUILD_EXIT == '0'
        run: |
          BIN="out/MLK-${{ matrix.target.arch }}-${BUILD_VERSION}"
          chmod +x "$BIN"
          echo "" >> logs/build-${{ matrix.target.arch }}.log
          echo "=== Smoke test ===" >> logs/build-${{ matrix.target.arch }}.log
          "$BIN" --version 2>&1 | tee -a logs/build-${{ matrix.target.arch }}.log
          echo "" >> logs/build-${{ matrix.target.arch }}.log
          "$BIN" --help 2>&1 | tee -a logs/build-${{ matrix.target.arch }}.log

      - name: Upload intermediate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmp-build-${{ matrix.target.arch }}
          path: |
            out/
            logs/
          if-no-files-found: warn
          retention-days: 1

      - name: Fail if build failed
        if: always()
        run: |
          if [ "${BUILD_EXIT}" != "0" ]; then
            echo "::error::Build failed for ${{ matrix.target.arch }} (exit ${BUILD_EXIT})"
            exit 1
          fi

  build-android:
    name: build / android-aarch64
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Prepare
        run: |
          mkdir -p logs out
          echo "=== Build started: android-aarch64 ===" > logs/build-android-aarch64.log
          echo "Date: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S CST')" >> logs/build-android-aarch64.log
          echo "" >> logs/build-android-aarch64.log

      - name: Install Android NDK
        run: |
          ANDROID_NDK_VERSION=r27c
          echo "=== Installing Android NDK ${ANDROID_NDK_VERSION} ===" | tee -a logs/build-android-aarch64.log
          wget -q "https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux.zip" -O /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d "$HOME"
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$HOME/android-ndk-${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Compute version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-$(echo "${GITHUB_SHA}" | cut -c1-8)"
          fi
          echo "BUILD_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Version: ${VERSION}" >> logs/build-android-aarch64.log
          echo "" >> logs/build-android-aarch64.log

      - name: Configure Android toolchain
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "${TOOLCHAIN}/bin/aarch64-linux-android24-clang"
          ar = "${TOOLCHAIN}/bin/llvm-ar"
          EOF

      - name: Build
        run: |
          set +e
          echo "=== cargo build --release --target aarch64-linux-android ===" >> logs/build-android-aarch64.log
          cargo build --release --target aarch64-linux-android 2>&1 | tee -a logs/build-android-aarch64.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "" >> logs/build-android-aarch64.log
          echo "=== Build exit code: ${BUILD_EXIT} ===" >> logs/build-android-aarch64.log
          echo "BUILD_EXIT=${BUILD_EXIT}" >> "$GITHUB_ENV"
          if [ "$BUILD_EXIT" = "0" ]; then
            cp target/aarch64-linux-android/release/mtk-logo-toolkit "out/MLK-android-aarch64-${BUILD_VERSION}"
            echo "" >> logs/build-android-aarch64.log
            echo "=== Binary info ===" >> logs/build-android-aarch64.log
            file "out/MLK-android-aarch64-${BUILD_VERSION}" >> logs/build-android-aarch64.log 2>&1
          fi
          exit 0

      - name: Upload intermediate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmp-build-android-aarch64
          path: |
            out/
            logs/
          if-no-files-found: warn
          retention-days: 1

      - name: Fail if build failed
        if: always()
        run: |
          if [ "${BUILD_EXIT}" != "0" ]; then
            echo "::error::Build failed for android-aarch64 (exit ${BUILD_EXIT})"
            exit 1
          fi

  collect:
    name: collect
    needs: [build-linux, build-android]
    if: always()
    runs-on: ubuntu-22.04

    steps:
      - name: Compute version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-$(echo "${GITHUB_SHA}" | cut -c1-8)"
          fi
          echo "BUILD_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Assemble final artifact
        run: |
          mkdir -p stage/logs

          echo "=== Collecting binaries ==="
          for arch in amd64 aarch64 android-aarch64; do
            BIN="artifacts/tmp-build-${arch}/out/MLK-${arch}-${BUILD_VERSION}"
            if [ -f "$BIN" ]; then
              cp "$BIN" stage/
              echo "  + MLK-${arch}-${BUILD_VERSION}"
            else
              echo "  - MLK-${arch}-${BUILD_VERSION} (missing — build may have failed)"
            fi
          done

          echo "=== Collecting logs ==="
          cp artifacts/tmp-build-*/logs/*.log stage/logs/ 2>/dev/null || true
          ls -la stage/logs/

          echo "=== Final contents ==="
          find stage -type f | sort

      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: MLK-${{ env.BUILD_VERSION }}
          path: stage/
          if-no-files-found: error